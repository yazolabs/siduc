x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
    args:
      PHP_VERSION: 8.4
      COMPOSER_VERSION: 2.8
      HOST_UID: ${HOST_UID:-1001}
      HOST_GID: ${HOST_GID:-1001}
  image: php:8.4-ieducar
  working_dir: /var/www/ieducar
  depends_on:
    postgres:
      condition: service_started
    redis:
      condition: service_started
  environment:
    CACHE_DRIVER: redis
    REDIS_HOST: redis
    DB_HOST: postgres
    PGPASSWORD: ${DB_PASSWORD}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  fpm:
    <<: *php
    container_name: ieducar-fpm
    command: php-fpm
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    <<: *php
    container_name: ieducar-horizon
    command: php /var/www/ieducar/artisan horizon
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan horizon' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: ieducar-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    depends_on:
      - fpm
    volumes:
      - ./docker/nginx/conf.d/prod:/etc/nginx/conf.d/
      - ./docker/nginx/snippets/prod:/etc/nginx/snippets/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost || true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    container_name: ieducar-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGUSER: ${DB_USERNAME}
    volumes:
      - ieducar_postgres_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: ieducar-redis
    image: redis:8-alpine
    restart: always
    ports:
      - ${DOCKER_REDIS_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ieducar_postgres_data:
