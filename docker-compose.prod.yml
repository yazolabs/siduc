x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile.prod
    args:
      PHP_VERSION: 8.4
      COMPOSER_VERSION: 2.8
      HOST_UID: ${HOST_UID:-1001}
      HOST_GID: ${HOST_GID:-1001}
      VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY}
      VITE_FROALA_KEY: ${VITE_FROALA_KEY}
      CACHE_BUST: ${COOLIFY_RESOURCE_UUID:-local}-${COOLIFY_BRANCH:-local}-${COOLIFY_DEPLOYMENT_ID:-0}
  image: php:8.4-ieducar
  working_dir: /var/www/ieducar
  depends_on:
    postgres:
      condition: service_started
    redis:
      condition: service_started
  environment:
    CACHE_DRIVER: redis
    REDIS_HOST: redis
    DB_HOST: postgres
    PGPASSWORD: ${DB_PASSWORD}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  fpm:
    <<: *php
    container_name: ieducar-fpm
    command: php-fpm
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    <<: *php
    container_name: ieducar-horizon
    command: php /var/www/ieducar/artisan horizon
    depends_on:
      fpm:
        condition: service_started
      redis:
        condition: service_started
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan horizon' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: ieducar-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
      args:
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY}
        VITE_FROALA_KEY: ${VITE_FROALA_KEY}
        CACHE_BUST: ${COOLIFY_RESOURCE_UUID:-local}-${COOLIFY_BRANCH:-local}-${COOLIFY_DEPLOYMENT_ID:-0}
    depends_on:
      - fpm
    restart: always
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    container_name: ieducar-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGUSER: ${DB_USERNAME}
    networks:
      default: {}
      siduc-shared:
        aliases:
          - siduc-postgres
    volumes:
      - ieducar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: ieducar-redis
    image: redis:8-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ieducar_postgres_data:

networks:
  siduc-shared:
    external: true
    name: siduc-shared
