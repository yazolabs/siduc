server {
    listen 80 default_server;

    root /var/www/ieducar/public;
    index index.php index.html;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location ^~ /build/ {
        root /var/www/ieducar/public;
        try_files $uri =404;
        access_log off;
        expires 1s;
    }

    include snippets/snippets.conf;
}
